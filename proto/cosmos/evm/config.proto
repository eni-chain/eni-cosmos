syntax = "proto3";
package cosmos.evm;

import "gogoproto/gogo.proto";

option go_package = "github.com/eni-chain/eni-cosmos/x/evm/types";


message ChainConfig {
    int64 cancun_time = 1 [
      (gogoproto.moretags) = "yaml:\"cancun_time\""
    ];
    int64 prague_time = 2 [
      (gogoproto.moretags) = "yaml:\"prague_time\""
    ];
    int64 verkle_time = 3 [
      (gogoproto.moretags) = "yaml:\"verkle_time\""
    ];
  }