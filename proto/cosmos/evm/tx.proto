syntax = "proto3";
package cosmos.evm;

import "google/protobuf/any.proto";
import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "cosmos/evm/params.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/evm/enums.proto";
import "cosmos/evm/receipt.proto";

option go_package = "github.com/eni-chain/eni-cosmos/x/evm/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc EVMTransaction(MsgEVMTransaction) returns (MsgEVMTransactionResponse);
  rpc Send(MsgSend) returns (MsgSendResponse);
  rpc RegisterPointer(MsgRegisterPointer) returns (MsgRegisterPointerResponse);
  rpc AssociateContractAddress(MsgAssociateContractAddress) returns (MsgAssociateContractAddressResponse);
  rpc Associate(MsgAssociate) returns (MsgAssociateResponse);
  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
  rpc AddBlackLists(MsgAddBlackLists) returns (MsgAddBlackListsResponse);
  rpc DelBlackLists(MsgDelBlackLists) returns (MsgDelBlackListsResponse);
}


// MsgAddBlackLists is the Msg/UpdateParams request type.
message MsgAddBlackLists {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "goeni/x/epoch/MsgAddBlackLists";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  repeated string addresses = 2;
}

// MsgDelAddBlackLists is the Msg/UpdateParams request type.
message MsgDelBlackLists {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "goeni/x/epoch/MsgAddBlackLists";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  repeated string addresses = 2;
}


// MsgDelAddBlackListsResponse message.
message MsgDelBlackListsResponse {}

// MsgAddBlackListsResponse message.
message MsgAddBlackListsResponse {}


// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "goeni/x/epoch/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.
  //
  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

message MsgEVMTransaction {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1; //it is derived.SenderSeiAddr
  google.protobuf.Any data = 2;
  bytes derived = 3 [(gogoproto.customtype) = "github.com/eni-chain/go-eni/x/evm/derived.Derived"];
}

message MsgEVMTransactionResponse {
  uint64 gas_used = 1;
  string vm_error = 2;
  bytes return_data = 3;
  string hash = 4;
  repeated Log logs = 5;
}

message MsgInternalEVMCall {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
  string value = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int"
  ];
  string to = 3;
  bytes data = 4;
}

message MsgInternalEVMCallResponse {}

message MsgInternalEVMDelegateCall {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
  bytes codeHash = 2;
  string to = 3;
  bytes data = 4;
  string fromContract = 5;
}

message MsgInternalEVMDelegateCallResponse {}

message MsgSend {
  option (cosmos.msg.v1.signer) = "from_address";
  string   from_address                    = 1;
  string   to_address                      = 2;
  repeated cosmos.base.v1beta1.Coin amount = 3
  [(gogoproto.nullable) = false, (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"];
}

message MsgSendResponse {}

message MsgRegisterPointer {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
  PointerType pointer_type = 2;
  string erc_address = 3;
}

message MsgRegisterPointerResponse {
  string pointer_address = 1;
}

message MsgAssociateContractAddress {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
  string address = 2;
}

message MsgAssociateContractAddressResponse {}

message MsgAssociate {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
  string custom_message = 2;
}

message MsgAssociateResponse {}